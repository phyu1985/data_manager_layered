name: Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyright
      - run: python tools/check_negative_types.py
      - run: python tools/check_release.py
      - run: python main.py outputs/ci-csv
      - run: python main.py outputs/ci-excel --report-format xlsx
      - run: python -m examples.formats
      - run: python -m examples.application_services
      - run: python -m examples.workflow outputs/ci-workflow --excel
      - run: python -m examples.excel_reports
